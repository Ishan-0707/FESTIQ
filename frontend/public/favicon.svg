<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14201B" />
      <stop offset="100%" stop-color="#0B120F" />
    </linearGradient>

    <!-- Campus Architecture Gold -->
    <linearGradient id="favArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#C6A96B" />
      <stop offset="100%" stop-color="#9E7E38" />
    </linearGradient>

    <!-- Central Star -->
    <radialGradient id="favStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF4D4" />
      <stop offset="100%" stop-color="#C6A96B" />
    </radialGradient>

    <!-- Cyan Wing -->
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="favTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Gold Wing -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#C6A96B" />
    </linearGradient>
    <linearGradient id="favGoldSub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Violet Foundation -->
    <linearGradient id="favViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Container Surface -->
  <rect width="100" height="100" rx="22" fill="url(#favBg)" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="#25382F" stroke-width="1.5" />

  <!-- CAMPUS CREST EMBLEM (Option D) - Prominent, Centered & High Impact -->
  <g transform="translate(-8, 6.5) scale(1.16)">
    <!-- 1. Roof & Architecture -->
    <path d="M 50,14 L 75,27 L 72,31 L 50,19.5 L 28,31 L 25,27 Z" fill="url(#favArch)" />
    <rect x="31" y="31.5" width="38" height="3" rx="0.8" fill="url(#favArch)" />
    <rect x="34" y="34.5" width="4.5" height="13.5" rx="0.6" fill="url(#favArch)" />
    <rect x="42.5" y="34.5" width="3" height="13.5" rx="0.5" fill="url(#favArch)" opacity="0.9" />
    <rect x="54.5" y="34.5" width="3" height="13.5" rx="0.5" fill="url(#favArch)" opacity="0.9" />
    <rect x="61.5" y="34.5" width="4.5" height="13.5" rx="0.6" fill="url(#favArch)" />

    <!-- 2. Discovery Star -->
    <path d="M 50,33.5 Q 50,41 44,41 Q 50,41 50,48.5 Q 50,41 56,41 Q 50,41 50,33.5 Z" fill="url(#favStar)" />
    <circle cx="50" cy="41" r="1.2" fill="#FFFFFF" />

    <!-- 3. Blooming Book Pages -->
    <path d="M 48,51 C 38,49 26,43 17,33 C 17,33 21,32 23,34 C 30,40 40,44 48,45 Z" fill="url(#favCyan)" />
    <path d="M 14,27.5 Q 14,30.5 11.5,30.5 Q 14,30.5 14,33.5 Q 14,30.5 16.5,30.5 Q 14,30.5 14,27.5 Z" fill="#67E8F9" />

    <path d="M 48,54.5 C 37,53.5 26,48.5 18,42 C 20,41 23,42 26,44 C 33,48 41,50 48,50 Z" fill="url(#favTeal)" />
    <path d="M 50,60 C 39,61 28,58 20,52 C 22,51 25,52 28,54 C 35,57 43,57 50,56 Z" fill="url(#favViolet)" />

    <path d="M 52,51 C 62,49 74,43 83,33 C 83,33 79,32 77,34 C 70,40 60,44 52,45 Z" fill="url(#favGold)" />
    <path d="M 52,54.5 C 63,53.5 74,48.5 82,42 C 80,41 77,42 74,44 C 67,48 59,50 52,50 Z" fill="url(#favGoldSub)" />
    <path d="M 50,60 C 61,61 72,58 80,52 C 78,51 75,52 72,54 C 65,57 57,57 50,56 Z" fill="url(#favViolet)" />
  </g>
</svg>
