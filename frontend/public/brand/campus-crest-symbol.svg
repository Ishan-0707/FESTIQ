<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 12 80 51" width="100%" height="100%" fill="none">
  <defs>
    <style>
      :root {
        --arch-1: #F3E5AB;
        --arch-2: #C6A96B;
        --arch-3: #9E7E38;
        --star-core: #FFFFFF;
        --star-body: #FFF4D4;
        --star-glow: #C6A96B;
        --cyan-1: #22D3EE;
        --cyan-2: #06B6D4;
        --cyan-3: #0D9488;
        --teal-1: #06B6D4;
        --teal-2: #0F766E;
        --gold-1: #FDE68A;
        --gold-2: #F59E0B;
        --gold-3: #C6A96B;
        --gold-sub-1: #F59E0B;
        --gold-sub-2: #B45309;
        --violet-1: #A855F7;
        --violet-2: #7C3AED;
        --violet-3: #4F46E5;
        --spark-tip: #67E8F9;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --arch-1: #356B96;
          --arch-2: #234E70;
          --arch-3: #183650;
          --star-core: #FEF3C7;
          --star-body: #D97706;
          --star-glow: #92400E;
          --cyan-1: #0284C7;
          --cyan-2: #0369A1;
          --cyan-3: #0F766E;
          --teal-1: #0D9488;
          --teal-2: #115E59;
          --gold-1: #D97706;
          --gold-2: #B45309;
          --gold-3: #78350F;
          --gold-sub-1: #B45309;
          --gold-sub-2: #78350F;
          --violet-1: #6366F1;
          --violet-2: #4F46E5;
          --violet-3: #3730A3;
          --spark-tip: #0284C7;
        }
      }
    </style>

    <linearGradient id="crestArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--arch-1, #F3E5AB)" />
      <stop offset="50%" stop-color="var(--arch-2, #C6A96B)" />
      <stop offset="100%" stop-color="var(--arch-3, #9E7E38)" />
    </linearGradient>

    <radialGradient id="crestStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--star-core, #FFFFFF)" />
      <stop offset="45%" stop-color="var(--star-body, #FFF4D4)" />
      <stop offset="100%" stop-color="var(--star-glow, #C6A96B)" />
    </radialGradient>

    <linearGradient id="crestCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--cyan-1, #22D3EE)" />
      <stop offset="60%" stop-color="var(--cyan-2, #06B6D4)" />
      <stop offset="100%" stop-color="var(--cyan-3, #0D9488)" />
    </linearGradient>

    <linearGradient id="crestTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--teal-1, #06B6D4)" />
      <stop offset="100%" stop-color="var(--teal-2, #0F766E)" />
    </linearGradient>

    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--gold-1, #FDE68A)" />
      <stop offset="50%" stop-color="var(--gold-2, #F59E0B)" />
      <stop offset="100%" stop-color="var(--gold-3, #C6A96B)" />
    </linearGradient>

    <linearGradient id="crestGoldSub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--gold-sub-1, #F59E0B)" />
      <stop offset="100%" stop-color="var(--gold-sub-2, #B45309)" />
    </linearGradient>

    <linearGradient id="crestViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--violet-1, #A855F7)" />
      <stop offset="60%" stop-color="var(--violet-2, #7C3AED)" />
      <stop offset="100%" stop-color="var(--violet-3, #4F46E5)" />
    </linearGradient>
  </defs>

  <!-- TOP ARCHITECTURAL CAMPUS STRUCTURE -->
  <path d="M 50,14 L 75,27 L 72,31 L 50,19.5 L 28,31 L 25,27 Z" fill="url(#crestArch)" />
  <rect x="31" y="31.5" width="38" height="3" rx="0.8" fill="url(#crestArch)" />
  <rect x="34" y="34.5" width="4.5" height="13.5" rx="0.6" fill="url(#crestArch)" />
  <rect x="42.5" y="34.5" width="3" height="13.5" rx="0.5" fill="url(#crestArch)" opacity="0.9" />
  <rect x="54.5" y="34.5" width="3" height="13.5" rx="0.5" fill="url(#crestArch)" opacity="0.9" />
  <rect x="61.5" y="34.5" width="4.5" height="13.5" rx="0.6" fill="url(#crestArch)" />

  <!-- CENTRAL DISCOVERY STAR -->
  <path d="M 50,33.5 Q 50,41 44,41 Q 50,41 50,48.5 Q 50,41 56,41 Q 50,41 50,33.5 Z" fill="url(#crestStar)" />
  <circle cx="50" cy="41" r="1.2" fill="var(--star-core, #FFFFFF)" />

  <!-- BOTTOM OPEN-BOOK / BLOOMING WING LAYERS -->
  <path d="M 48,51 C 38,49 26,43 17,33 C 17,33 21,32 23,34 C 30,40 40,44 48,45 Z" fill="url(#crestCyan)" />
  <path d="M 14,27.5 Q 14,30.5 11.5,30.5 Q 14,30.5 14,33.5 Q 14,30.5 16.5,30.5 Q 14,30.5 14,27.5 Z" fill="var(--spark-tip, #67E8F9)" />

  <path d="M 48,54.5 C 37,53.5 26,48.5 18,42 C 20,41 23,42 26,44 C 33,48 41,50 48,50 Z" fill="url(#crestTeal)" />
  <path d="M 50,60 C 39,61 28,58 20,52 C 22,51 25,52 28,54 C 35,57 43,57 50,56 Z" fill="url(#crestViolet)" />

  <path d="M 52,51 C 62,49 74,43 83,33 C 83,33 79,32 77,34 C 70,40 60,44 52,45 Z" fill="url(#crestGold)" />
  <path d="M 52,54.5 C 63,53.5 74,48.5 82,42 C 80,41 77,42 74,44 C 67,48 59,50 52,50 Z" fill="url(#crestGoldSub)" />
  <path d="M 50,60 C 61,61 72,58 80,52 C 78,51 75,52 72,54 C 65,57 57,57 50,56 Z" fill="url(#crestViolet)" />
</svg>

